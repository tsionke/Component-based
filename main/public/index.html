<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric Telebirr Payment Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; }
        header { background: #2563eb; color: white; padding: 30px; text-align: center; }
        .tabs { display: flex; background: #f8fafc; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab.active { background: white; border-bottom-color: #2563eb; color: #2563eb; font-weight: 600; }
        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: 500; color: #374151; }
        input, textarea, select { padding: 12px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 16px; transition: border-color 0.3s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #2563eb; }
        button { padding: 15px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 20px; background: #f0fdf4; border-radius: 10px; border-left: 5px solid #10b981; white-space: pre-wrap; font-family: monospace; max-height: 300px; overflow-y: auto; }
        .error { background: #fef2f2; border-left-color: #ef4444; color: #dc2626; }
        #rawRequest { background: #1f2937; color: #f9fafb; padding: 20px; border-radius: 10px; font-family: monospace; white-space: pre; max-height: 400px; overflow-y: auto; }
        .copy-btn { position: absolute; top: 10px; right: 10px; padding: 8px 12px; background: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #e5e7eb; }
        h3 { color: #1f2937; margin-bottom: 15px; }
        footer { text-align: center; padding: 20px; color: #6b7280; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 Fabric Telebirr Payment Demo</h1>
            <p>Test payment integration with backend API</p>
        </header>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('auth')">Auth Token</div>
            <div class="tab" onclick="switchTab('order')">Regular Order</div>
            <div class="tab" onclick="switchTab('mandate')">Mandate Order</div>
            <div class="tab" onclick="switchTab('health')">Health</div>
        </div>
        
        <div id="auth" class="tab-content active">
            <div class="section">
                <h3>🔐 Verify Auth Token</h3>
                <form id="authForm">
                    <label>Auth Token:</label>
                    <input type="text" id="authToken" placeholder="your_h5_auth_token" required>
                    <button type="submit">Verify Token</button>
                </form>
                <div id="authResult"></div>
            </div>
        </div>
        
        <div id="order" class="tab-content">
            <div class="section">
                <h3>💳 Create Payment Order</h3>
                <form id="orderForm">
                    <label>Title:</label>
                    <input type="text" id="orderTitle" value="Test Product" required>
                    <label>Amount (ETB):</label>
                    <input type="number" id="orderAmount" value="150.50" step="0.01" min="0.01" required>
                    <button type="submit">Create Order</button>
                </form>
                <div id="orderResult"></div>
            </div>
        </div>
        
        <div id="mandate" class="tab-content">
            <div class="section">
                <h3>📋 Create Mandate Order</h3>
                <form id="mandateForm">
                    <label>Title:</label>
                    <input type="text" id="mandateTitle" value="Monthly Subscription" required>
                    <label>Amount (ETB):</label>
                    <input type="number" id="mandateAmount" value="100.00" step="0.01" min="0.01" required>
                    <label>Contract No:</label>
                    <input type="text" id="contractNo" value="CONTRACT_123" required>
                    <button type="submit">Create Mandate</button>
                </form>
                <div id="mandateResult"></div>
            </div>
        </div>
        
        <div id="health" class="tab-content">
            <div class="section">
                <h3>✅ Server Health</h3>
                <button onclick="checkHealth()">Check Health</button>
                <div id="healthResult"></div>
            </div>
        </div>
        
        <footer>
            Backend: http://localhost:3000 | Ensure server is running (npm start)
        </footer>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        
        // Tab switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
        
        // API call helper
        async function apiCall(endpoint, body) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                return await response.json();
            } catch (error) {
                throw new Error(`Network error: ${error.message}. Is backend running?`);
            }
        }
        
        // Auth form
        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const resultDiv = document.getElementById('authResult');
            const btn = form.querySelector('button');
            
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            
            try {
                const data = await apiCall('/apply/h5token', { authToken: form.authToken.value });
                resultDiv.innerHTML = `<div class="result">${JSON.stringify(data, null, 2)}</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">${error.message}</div>`;
            }
            
            btn.disabled = false;
            btn.textContent = 'Verify Token';
        });
        
        // Order form
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const resultDiv = document.getElementById('orderResult');
            const btn = form.querySelector('button');
            
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            try {
                const data = await apiCall('/create/order', {
                    title: form.orderTitle.value,
                    amount: parseFloat(form.orderAmount.value)
                });
                resultDiv.innerHTML = `
                    <div>✅ Order Created!</div>
                    <h4>Payment Request (Copy for Telebirr):</h4>
                    <div id="rawRequest" style="position: relative;">
                        <button class="copy-btn" onclick="copyRawRequest()">Copy Raw</button>
                        <pre>${data.rawRequest || JSON.stringify(data, null, 2)}</pre>
                    </div>
                    <div>${JSON.stringify(data, null, 2)}</div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">${error.message}</div>`;
            }
            
            btn.disabled = false;
            btn.textContent = 'Create Order';
        });
        
        // Mandate form
        document.getElementById('mandateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const resultDiv = document.getElementById('mandateResult');
            const btn = form.querySelector('button');
            
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            try {
                const data = await apiCall('/create/mandetOrder', {
                    title: form.mandateTitle.value,
                    amount: parseFloat(form.mandateAmount.value),
                    ContractNo: form.contractNo.value
                });
                resultDiv.innerHTML = `
                    <div>✅ Mandate Created!</div>
                    <h4>Payment Request:</h4>
                    <div id="rawRequest" style="position: relative;">
                        <button class="copy-btn" onclick="copyRawRequest()">Copy Raw</button>
                        <pre>${data.rawRequest || JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">${error.message}</div>`;
            }
            
            btn.disabled = false;
            btn.textContent = 'Create Mandate';
        });
        
        // Health check
        async function checkHealth() {
            const resultDiv = document.getElementById('healthResult');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                resultDiv.innerHTML = `<div class="result">Server Healthy! Uptime: ${data.uptime}s</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">Server not running: ${error.message}</div>`;
            }
        }
        
        // Copy raw request
        function copyRawRequest() {
            const raw = document.querySelector('#rawRequest pre').textContent;
            navigator.clipboard.writeText(raw).then(() => {
                const btn = event.target;
                const oldText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = oldText, 2000);
            });
        }
        
        // Auto check health on load
        window.addEventListener('load', checkHealth);
    </script>
</body>
</html>
